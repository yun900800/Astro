backend:
  name: github
  branch: main
  repo: yun900800/Astro
  site_domain: blog.innovation.pp.ua
  base_url: https://blog.innovation.pp.ua
  auth_endpoint: oauth

collections:
  - name: "note"
    label: "笔记"
    folder: "src/content/note"
    create: true
    slug: "{{year}}.{{month}}.{{day}}_{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string", required: true }
      - {
          label: "简介",
          name: "description",
          widget: "string",
          default: "这是一篇有意思的文章",
          required: false,
        }
      - {
          label: "发布日期",
          name: "publishDate",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
          required: true,
        }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "post"
    label: "博文"
    folder: "src/content/post"
    create: true
    slug: "{{year}}.{{month}}.{{day}}_{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string", required: true }
      - {
          label: "简介",
          name: "description",
          widget: "string",
          default: "这是一篇有意思的文章",
          required: true,
        }
      - {
          label: "发布日期",
          name: "publishDate",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          required: true,
        }
      - { label: "标签", name: "tags", widget: "list", required: true }
      - {
          label: "ogImage",
          name: "ogImage",
          widget: "string",
          default: "/qssjdr.jpg",
          required: true,
        }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "draft_note"
    label: "草稿箱-笔记"
    folder: "src/content/draft/note"
    create: true
    slug: "{{year}}.{{month}}.{{day}}_{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string", required: true }
      - {
          label: "简介",
          name: "description",
          widget: "string",
          default: "这是一篇有意思的文章",
          required: false,
        }
      - {
          label: "发布日期",
          name: "publishDate",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
          required: true,
        }
      - { label: "正文", name: "body", widget: "markdown" }
      - {
          label: "发布",
          name: "publish",
          widget: "boolean",
          default: false,
          required: false,
          hint: "打开本开关再保存即发布上线；发布后本条目会从草稿箱移出。",
        }

  - name: "draft_post"
    label: "草稿箱-博文"
    folder: "src/content/draft/post"
    create: true
    slug: "{{year}}.{{month}}.{{day}}_{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string", required: true }
      - {
          label: "简介",
          name: "description",
          widget: "string",
          default: "这是一篇有意思的文章",
          required: true,
        }
      - {
          label: "发布日期",
          name: "publishDate",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          required: true,
        }
      - { label: "标签", name: "tags", widget: "list", required: true }
      - {
          label: "ogImage",
          name: "ogImage",
          widget: "string",
          default: "/qssjdr.jpg",
          required: true,
        }
      - { label: "正文", name: "body", widget: "markdown" }
      - {
          label: "发布",
          name: "publish",
          widget: "boolean",
          default: false,
          required: false,
          hint: "打开本开关再保存即发布上线；发布后本条目会从草稿箱移出。",
        }

media_folder: "public/assets/images"
public_folder: "/assets/images"
